<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tune-In Gym - Japanese Listening Habit</title>

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <!-- ホーム画面アプリ（Gym Home）の中で開いても全画面のままにする設定。
         下の7行を Write-Up Gym と Speak-Up Gym の index.html にも入れること。 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#E07A5F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zen: { 50:'#f7f7f5',100:'#efefe9',200:'#dcdcd5',300:'#c2c2b6',400:'#a3a393',500:'#858571',600:'#6b6b58',700:'#565646',800:'#46463a',900:'#3a3a31' },
              tune: { 50:'#f2f3fa',100:'#e2e4f2',200:'#c5c9e4',300:'#a3aad2',400:'#868ec2',500:'#6b73ae',600:'#565d93',700:'#454a76',800:'#343858',900:'#26293f' }
            },
            fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
    </script>

    <style>
      body { font-family: 'Noto Sans JP', sans-serif; background-color: #f7f7f5; color: #46463a; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>

  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState, useEffect } from 'react';
      import { createRoot } from 'react-dom/client';

      // ===== サーバー(GAS Web API)呼び出しヘルパー =====
      // ★デプロイしたGASウェブアプリのURL（…/exec）をここに貼る★
      const API_URL = 'https://script.google.com/macros/s/AKfycbzdYzR_15z5l261LS1_n0aCybQ-owpAdgCm9LK3iQy9MKkbPSC4wjnSHVbIGS4A68fWzw/exec';

      // GASへのPOSTは必ず script.googleusercontent.com へ302リダイレクトされ、
      // その2回目のリクエストがGoogle側の都合で時々404を返す（既知のクセ）。
      // サーバーは正常なので、届かなかっただけの失敗は自動で再送する。
      // ただし書き込みを伴う関数は二重登録の恐れがあるため再送しない。
      const RETRYABLE_FN = {
        getBootstrap: 1, studentLogin: 1, teacherLogin: 1,
        getMyLog: 1, teacherGetData: 1
      };
      const RETRY_WAITS_MS = [800, 2000, 4000];
      const sleep_ = (ms) => new Promise((r) => setTimeout(r, ms));
      const transient_ = (msg) => { const e = new Error(msg); e.transient = true; return e; };

      const gsOnce_ = async (fn, args) => {
        let res;
        try {
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ fn, args }),
            redirect: 'follow'
          });
        } catch (netErr) {
          throw transient_('Network error');
        }
        if (!res.ok) throw transient_('Server error (HTTP ' + res.status + ')');
        let json;
        try {
          json = JSON.parse(await res.text());
        } catch (parseErr) {
          throw transient_('Server error (invalid response)');
        }
        // ここから先はGASが実際に処理した結果。再送しても同じなのでそのまま投げる。
        if (!json.ok) throw new Error(json.error || 'Unknown server error');
        return json.data;
      };

      const gs = async (fn, ...args) => {
        const maxRetry = RETRYABLE_FN[fn] ? RETRY_WAITS_MS.length : 0;
        let lastErr;
        for (let i = 0; i <= maxRetry; i++) {
          try {
            return await gsOnce_(fn, args);
          } catch (err) {
            if (!err || err.transient !== true) throw err;
            lastErr = err;
            if (i < maxRetry) await sleep_(RETRY_WAITS_MS[i]);
          }
        }
        throw lastErr;
      };

      const friendlyError = (e) => {
        const m = (e && e.message) || String(e);
        if (m.indexOf('AUTH:') !== -1) return m.replace(/^.*AUTH:\s*/, '');
        return m;
      };

      // ===== 認証情報の保存 =====
      // 自分のキーに加えて、同じGitHub PagesにあるSpeak-Up Gym / Write-Up Gymの
      // ログイン情報も読む。どちらかにログイン済みの学生は入力なしで入れる。
      const AUTH_KEY = 'TIG_AUTH';
      const SIBLING_KEYS = ['SUG2_AUTH', 'wh_auth'];

      const readKey = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
      const loadAuth = () => {
        const own = readKey(AUTH_KEY);
        if (own && own.name && own.pin) return own;
        for (const k of SIBLING_KEYS) {
          const a = readKey(k);
          if (a && a.name && a.pin) return { name: a.name, pin: a.pin };
        }
        return null;
      };
      const saveAuth = (a) => {
        try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {}
      };
      const loadTeacher = () => { try { return localStorage.getItem('TIG_TEACHER') || readKey('wh_teacher'); } catch (e) { return null; } };

      // ===== 日付ユーティリティ =====
      const pad = (n) => (n < 10 ? '0' : '') + n;
      const addDays = (ymd, n) => {
        const p = ymd.split('-');
        const d = new Date(+p[0], +p[1] - 1, +p[2]);
        d.setDate(d.getDate() + n);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      };
      const diffDays = (a, b) => {
        const pa = a.split('-'), pb = b.split('-');
        return Math.round((new Date(+pb[0], +pb[1] - 1, +pb[2]) - new Date(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
      };

      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      // '2026-09-01' → 'Tue, Sep 1'
      const longDate = (ymd) => {
        const p = String(ymd).split('-');
        const d = new Date(+p[0], +p[1] - 1, +p[2]);
        return DOW[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
      };

      const LEVEL = ['#efefe9', '#c5c9e4', '#a3aad2', '#6b73ae'];
      const BONUS_LEVEL = ['#efefe9', '#fae4bd', '#f3c579', '#e09f3e'];   // Pump-Up Week は琥珀色
      const SANDBOX_LEVEL = ['#efefe9', '#dcdcd5', '#c2c2b6', '#a3a393']; // Try-Out Week は灰色
      const levelOf = (m) => (m >= 20 ? 3 : m >= 10 ? 2 : m > 0 ? 1 : 0);
      const palette = (w) => (w.sandbox ? SANDBOX_LEVEL : w.bonus ? BONUS_LEVEL : LEVEL);

      // 週ごとの集計とストリークをまとめて計算。
      // 週は cfg.weekList（[{n, monday, bonus?, sandbox?, label?}]）で与えられる。
      //   通常の週  … MIN_MINUTES 以上で ✓。ストリークに数える
      //   ボーナス週… 任意参加。✓ もストリークも達成率も影響しないが、合計分数には入る
      //   体験週    … 練習用。どの集計にも一切入らない（合計分数にも入らない）
      // ストリークはリストの並び順で数え、ボーナス週と体験週は素通りするので途切れない。
      const summarize = (entries, cfg) => {
        const weeks = [];
        let weeksDone = 0, totalMin = 0, bonusMin = 0, sandboxMin = 0, streak = 0, run = 0;
        cfg.weekList.forEach((w) => {
          const days = [];
          let min = 0;
          for (let d = 0; d < 7; d++) {
            const ymd = addDays(w.monday, d);
            const e = entries[ymd];
            if (e) min += e.minutes;
            days.push({ ymd, minutes: e ? e.minutes : 0, shows: e ? e.shows : [], future: diffDays(cfg.today, ymd) > 0, today: ymd === cfg.today });
          }
          const started = diffDays(w.monday, cfg.today) >= 0;              // その週が始まっている
          const finished = diffDays(addDays(w.monday, 6), cfg.today) > 0;  // その週が終わった
          const base = { n: w.n, monday: w.monday, days, minutes: min, label: w.label,
                         past: started, now: String(w.n) === String(cfg.currentWeek) };

          if (w.sandbox) {           // 体験週：どこにも数えない
            sandboxMin += min;
            weeks.push({ ...base, sandbox: true, ok: false });
            return;
          }
          totalMin += min;
          if (w.bonus) {             // ボーナス週：合計分数には入るが、ストリークは素通り
            bonusMin += min;
            weeks.push({ ...base, bonus: true, ok: false });
            return;
          }

          const ok = min >= cfg.minMinutes;
          if (ok) weeksDone++;
          if (ok) run++; else if (finished) run = 0;   // 終わった週で未達成ならリセット
          if (started) streak = run;                   // 今週がまだでも途切れない
          weeks.push({ ...base, ok });
        });

        const nowWeek = weeks.find((x) => String(x.n) === String(cfg.currentWeek));
        return { weeks, weeksDone, totalMin, bonusMin, sandboxMin, streak,
                 thisWeekMinutes: nowWeek ? nowWeek.minutes : 0,
                 thisWeekBonus: !!(nowWeek && nowWeek.bonus),
                 thisWeekSandbox: !!(nowWeek && nowWeek.sandbox),
                 thisWeekLabel: nowWeek ? nowWeek.label : '' };
      };

      // 今日が記録できる日かどうか、できないならその理由
      const todayStatus = (cfg) => {
        if (cfg.currentWeek) return { open: true };
        const list = cfg.weekList;
        if (!list.length) return { open: false, msg: 'Not set up yet.' };
        if (diffDays(cfg.today, list[0].monday) > 0) return { open: false, msg: 'Tune-In Gym opens on ' + list[0].monday + '.' };
        return { open: false, msg: 'The listening weeks are over. Thank you.' };
      };

      // ===== 小さい部品（Speak-Up Gym / Write-Up Gym と同じ作り） =====
      const Spinner = ({ emoji, title, subtitle }) => (
        <div className="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6">
          <div className="relative w-24 h-24">
            <div className="absolute top-0 left-0 w-full h-full border-4 border-zen-200 rounded-full"></div>
            <div className="absolute top-0 left-0 w-full h-full border-4 border-tune-500 rounded-full border-t-transparent animate-spin"></div>
            <div className="absolute inset-0 flex items-center justify-center text-4xl">{emoji}</div>
          </div>
          <h3 className="text-xl font-medium text-zen-800">{title}</h3>
          <p className="text-zen-500 max-w-sm">{subtitle}</p>
        </div>
      );

      // 共通の外枠（ヘッダー付き）。SUGのヘッダーに合わせている。
      const Shell = ({ who, onLogout, wide, children }) => (
        <div className="min-h-screen bg-zen-50 text-zen-800 font-sans">
          <header className="bg-white border-b border-zen-200 sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-orange-100 rounded-full flex items-center justify-center text-xl shadow-sm border border-orange-200">🐯</div>
                <h1 className="text-xl font-bold tracking-tight">Tune-In Gym</h1>
              </div>
              <div className="flex items-center gap-4">
                <a href="/gymhome/" className="text-xs text-zen-500 hover:text-tune-600 flex items-center gap-1" title="Switch to another gym">
                  <span className="text-sm">🐯</span><span className="hidden sm:inline">Gym Home</span>
                </a>
                <span className="text-sm font-medium text-zen-600 hidden sm:block">{who}</span>
                <button onClick={onLogout} className="text-xs text-zen-400 hover:text-tune-600 underline">Logout</button>
              </div>
            </div>
          </header>
          <main className={(wide ? 'max-w-5xl' : 'max-w-lg') + ' mx-auto px-4 py-8 pb-20 animate-fade-in'}>
            {children}
          </main>
        </div>
      );

      const Stat = ({ value, label }) => (
        <div className="flex-1 bg-white border border-zen-200 rounded-2xl py-3 text-center">
          <div className="text-3xl font-bold text-tune-600 leading-tight">{value}</div>
          <div className="text-[10px] text-zen-500 mt-0.5">{label}</div>
        </div>
      );

      // ===== ログイン画面（Speak-Up Gym / Write-Up Gym と同じ作り） =====
      const LoginScreen = ({ students, onStudentLogin, onTeacherLogin, error, busy }) => {
        const [mode, setMode] = useState('student');
        const [name, setName] = useState('');
        const [pin, setPin] = useState('');
        const [pin2, setPin2] = useState('');
        const [code, setCode] = useState('');
        const [codeSent, setCodeSent] = useState(false);
        const [maskedEmail, setMaskedEmail] = useState('');
        const [localBusy, setLocalBusy] = useState(false);
        const [localError, setLocalError] = useState('');
        const [passcode, setPasscode] = useState('');

        const isBusy = busy || localBusy;
        const shownError = localError || error;

        const switchMode = (m) => {
          setMode(m); setLocalError('');
          setPin(''); setPin2(''); setCode(''); setCodeSent(false); setMaskedEmail('');
        };

        const run = async (fn) => {
          setLocalBusy(true); setLocalError('');
          try { await fn(); } catch (e) { setLocalError(friendlyError(e)); }
          setLocalBusy(false);
        };

        const doSetPin = () => run(async () => { await gs('setPin', name, pin, pin2); onStudentLogin(name, pin); });
        const doSendCode = () => run(async () => {
          const d = await gs('requestPinReset', name);
          setCodeSent(true); setMaskedEmail(d.maskedEmail || '');
        });
        const doReset = () => run(async () => { await gs('resetPin', name, code, pin, pin2); onStudentLogin(name, pin); });

        const nameSelect = (
          <div>
            <label className="text-xs font-bold text-zen-500 uppercase">Your Name</label>
            <select value={name} onChange={(e) => setName(e.target.value)}
              className="w-full mt-1 border border-zen-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:border-tune-500">
              <option value="">-- Select your name --</option>
              {students.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        );
        const pinField = (label, val, setVal, ph) => (
          <div>
            <label className="text-xs font-bold text-zen-500 uppercase">{label}</label>
            <input type="password" value={val} onChange={(e) => setVal(e.target.value)} placeholder={ph}
              className="w-full mt-1 border border-zen-300 rounded-xl px-4 py-3 focus:outline-none focus:border-tune-500" />
          </div>
        );

        return (
          <div className="min-h-screen flex items-center justify-center bg-zen-50 p-4">
            <div className="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-zen-200 text-center">
              <div className="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-5xl shadow-md mx-auto mb-6 border-2 border-orange-200">🐯</div>
              <h1 className="text-3xl font-bold text-zen-800 mb-2">Tune-In Gym</h1>
              <p className="text-zen-500 mb-8">Japanese Listening Habit<br/>10+ minutes a week with Torai-kun</p>

              {shownError && <div className="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-4 border border-red-100">{shownError}</div>}

              {mode === 'student' && (
                <div className="space-y-4 text-left">
                  {nameSelect}
                  <div>
                    <label className="text-xs font-bold text-zen-500 uppercase">Your PIN</label>
                    <input type="password" value={pin} onChange={(e) => setPin(e.target.value)}
                      placeholder="Same PIN as Speak-Up / Write-Up Gym"
                      className="w-full mt-1 border border-zen-300 rounded-xl px-4 py-3 focus:outline-none focus:border-tune-500"
                      onKeyDown={(e) => { if (e.key === 'Enter') onStudentLogin(name, pin); }} />
                  </div>
                  <button onClick={() => onStudentLogin(name, pin)} disabled={isBusy || !name || !pin}
                    className="w-full py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-full font-bold shadow-lg transition-all disabled:opacity-50">
                    {isBusy ? 'Checking...' : 'Start'}
                  </button>
                  <div className="flex justify-between text-xs">
                    <button onClick={() => switchMode('setpin')} className="text-tune-600 hover:text-tune-500 underline">First time? Set your PIN</button>
                    <button onClick={() => switchMode('forgot')} className="text-zen-400 hover:text-tune-600 underline">Forgot your PIN?</button>
                  </div>
                  <p className="text-center">
                    <button onClick={() => switchMode('teacher')} className="text-xs text-zen-400 hover:text-tune-600 underline">Teacher login</button>
                  </p>
                </div>
              )}

              {mode === 'setpin' && (
                <div className="space-y-4 text-left">
                  <p className="text-xs text-zen-500">Choose your own PIN (at least 4 characters) and enter it twice. The same PIN works for Tune-In Gym, Speak-Up Gym and Write-Up Gym.</p>
                  {nameSelect}
                  {pinField('New PIN', pin, setPin, 'At least 4 characters')}
                  {pinField('Confirm New PIN', pin2, setPin2, 'Type it again')}
                  <button onClick={doSetPin} disabled={isBusy || !name || !pin || !pin2}
                    className="w-full py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-full font-bold shadow-lg disabled:opacity-50">
                    {isBusy ? 'Saving...' : 'Set PIN & Start'}
                  </button>
                  <p className="text-center">
                    <button onClick={() => switchMode('student')} className="text-xs text-zen-400 hover:text-tune-600 underline">← Back to login</button>
                  </p>
                </div>
              )}

              {mode === 'forgot' && (
                <div className="space-y-4 text-left">
                  {!codeSent ? (
                    <>
                      <p className="text-xs text-zen-500">We will email a 6-digit code to the address on your class roster.</p>
                      {nameSelect}
                      <button onClick={doSendCode} disabled={isBusy || !name}
                        className="w-full py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-full font-bold shadow-lg disabled:opacity-50">
                        {isBusy ? 'Sending...' : 'Send reset code'}
                      </button>
                    </>
                  ) : (
                    <>
                      <p className="text-xs text-zen-500">A code was sent to {maskedEmail}. It is valid for 30 minutes.</p>
                      <div>
                        <label className="text-xs font-bold text-zen-500 uppercase">6-digit code</label>
                        <input value={code} onChange={(e) => setCode(e.target.value)} placeholder="123456" inputMode="numeric"
                          className="w-full mt-1 border border-zen-300 rounded-xl px-4 py-3 tracking-widest focus:outline-none focus:border-tune-500" />
                      </div>
                      {pinField('New PIN', pin, setPin, 'At least 4 characters')}
                      {pinField('Confirm New PIN', pin2, setPin2, 'Type it again')}
                      <button onClick={doReset} disabled={isBusy || !name || !code || !pin || !pin2}
                        className="w-full py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-full font-bold shadow-lg disabled:opacity-50">
                        {isBusy ? 'Resetting...' : 'Reset PIN & Start'}
                      </button>
                    </>
                  )}
                  <p className="text-center">
                    <button onClick={() => switchMode('student')} className="text-xs text-zen-400 hover:text-tune-600 underline">← Back to login</button>
                  </p>
                </div>
              )}

              {mode === 'teacher' && (
                <div className="space-y-4 text-left">
                  <div>
                    <label className="text-xs font-bold text-zen-500 uppercase">Teacher passcode</label>
                    <input type="password" value={passcode} onChange={(e) => setPasscode(e.target.value)}
                      className="w-full mt-1 border border-zen-300 rounded-xl px-4 py-3 focus:outline-none focus:border-tune-500"
                      onKeyDown={(e) => { if (e.key === 'Enter') onTeacherLogin(passcode); }} />
                  </div>
                  <button onClick={() => onTeacherLogin(passcode)} disabled={isBusy || !passcode}
                    className="w-full py-4 bg-zen-700 hover:bg-zen-600 text-white rounded-full font-bold shadow-lg disabled:opacity-50">
                    {isBusy ? 'Checking...' : 'Teacher login'}
                  </button>
                  <p className="text-center">
                    <button onClick={() => switchMode('student')} className="text-xs text-zen-400 hover:text-tune-600 underline">Back to student login</button>
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ===== カレンダー =====
      const Calendar = ({ sum }) => (
        <div className="bg-white border border-zen-200 rounded-2xl p-4">
          <div className="grid gap-1 mb-1.5" style={{ gridTemplateColumns: '28px repeat(7, 1fr) 24px' }}>
            <div></div>
            {['M','T','W','T','F','S','S'].map((d, i) => <div key={i} className="text-[10px] text-zen-400 text-center">{d}</div>)}
            <div></div>
          </div>
          {sum.weeks.map((w) => {
            const special = w.bonus || w.sandbox;
            const tone = w.sandbox
              ? { line: 'bg-zen-300', chip: 'text-zen-600 bg-zen-100 border-zen-300', lab: 'text-zen-500', mark: 'text-zen-400', icon: '🧪' }
              : { line: 'bg-amber-200', chip: 'text-amber-700 bg-amber-50 border-amber-200', lab: 'text-amber-600', mark: 'text-amber-500', icon: '💪' };
            return (
              <div key={String(w.n)}>
                {special && (
                  <div className="flex items-center gap-2 mt-2 mb-1.5">
                    <div className={'h-px flex-1 ' + tone.line}></div>

      // ===== 学生の画面 =====

        // from: 'same'（最初の画面の自由記入欄）/ 'other'（ジャンル別リストの下の Something else）

        const inAWeek = (ymd) => cfg.weekList.some((w) => {

            <>

              {step === 'home' && (

                  <div className="text-center py-2 mb-6">

                              : 'bg-tune-600 hover:bg-tune-500 text-white')}>
                      {sum.thisWeekSandbox
                        ? 'Try logging something'
                        : sum.thisWeekBonus
                          ? (sum.thisWeekMinutes ? '★ ' + sum.thisWeekMinutes + ' bonus minutes. Log more' : 'Log some bonus listening')
                          : sum.thisWeekMinutes >= cfg.minMinutes
                            ? '✓ This week is done. Log another session'
                            : 'Log what I listened to'}
                    </button>
                  ) : (
                    <div className="w-full mt-4 py-4 rounded-2xl text-center text-sm text-zen-500 bg-zen-100 border border-zen-200">
                      {open.msg}
                    </div>
                  )}
                  <div className="flex gap-4 justify-center mt-3">
                    <button onClick={() => { setBrowse(true); go('genre'); }}
                      className="text-sm text-zen-400 hover:text-tune-600">Browse podcasts</button>
                    <span className="text-zen-300">·</span>
                    <button onClick={() => go('history')}
                      className="text-sm text-zen-400 hover:text-tune-600">My history</button>
                  </div>
                </>
              )}

              {step === 'history' && (
                <>
                  <Back to="home" />
                  <h2 className="text-lg font-bold">My listening history</h2>
                  <p className="text-xs text-zen-500 mb-4">
                    {hist.length
                      ? hist.length + (hist.length === 1 ? ' session' : ' sessions') + ', newest first.'

                  </p>

                  {!hist.length && (
                    <Card>
                      <div className="text-sm text-zen-500">

                        return (

                            className="bg-white border border-zen-200 rounded-2xl px-4 py-3 mb-1.5 flex items-center gap-3">

                              <div className="text-[15px] font-bold text-zen-900 break-words">{h.showName || 'A podcast'}</div>

                        placeholder="e.g. Nihongo Radio"
                        className="flex-1 min-w-0 border border-zen-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-tune-500" />
                      <button onClick={() => confirmOther('same')}
                        className="shrink-0 px-4 py-2.5 bg-tune-600 hover:bg-tune-500 text-white rounded-xl text-sm font-bold">
                        Next
                      </button>
                    </div>
                    {err && <p className="text-xs text-red-600 mt-2">{err}</p>}
                  </div>
                  <button onClick={() => { setBrowse(false); go('genre'); }}
                    className="w-full py-3 bg-white border border-zen-200 rounded-2xl text-sm hover:bg-zen-100">

                </>

              {step === 'genre' && (
                <>
                  <Back to={browse ? 'home' : 'same'} />
                  <h2 className="text-lg font-bold">Pick a genre</h2>
                  <p className="text-xs text-zen-500 mb-4">Each one has a few recommended shows.</p>
                  {boot.genres.map((g) => (
                    <Card key={g.id} onClick={() => openGenre(g)}>
                      <div className="flex items-center gap-3">
                        <div className="text-2xl">{g.emoji}</div>
                        <div>
                          <div className="font-bold text-[15px]">{g.name}</div>
                          <div className="text-xs text-zen-500">{g.blurb}</div>
                        </div>
                      </div>
                    </Card>
                  ))}
                </>
              )}

              {step === 'show' && genre && (
                <>
                  <Back to="genre" />
                  <h2 className="text-lg font-bold">{genre.emoji} {genre.name}</h2>
                  <p className="text-xs text-zen-500 mb-4">
                    {browse ? 'Tap a link to open the show.'
                            : 'Tap a link to open the show. When you are done, tap the card to log it.'}
                  </p>
                  {genre.shows.map((s) => (
                    <Card key={s.id} onClick={browse ? null : () => chooseShow(s)}>
                      <div className="font-bold text-[15px]">{s.name}</div>
                      <div className="text-xs text-zen-500 mt-1">{s.desc}</div>
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {s.links.map((L) => (
                          <a key={L.url} href={L.url} target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()}
                            className="text-xs text-tune-600 border border-tune-200 bg-tune-50 rounded-full px-3 py-1 hover:bg-tune-100">
                            ▶ {L.label}
                          </a>
                        ))}
                      </div>
                    </Card>
                  ))}
                  {!browse && (
                    <Card onClick={() => go('other')}>
                      <div className="font-bold text-[15px]">Something else</div>
                      <div className="text-xs text-zen-500 mt-1">A podcast that is not on this list</div>
                    </Card>
                  )}

              )}

              {step === 'other' && (
                <>
                  <Back to="show" />
                  <h2 className="text-lg font-bold">Name of the podcast</h2>
                  <p className="text-xs text-zen-500 mb-4">What did you listen to?</p>
                  <input value={otherName} onChange={(e) => setOtherName(e.target.value)} placeholder="e.g. Nihongo Radio"
                    className="w-full border border-zen-300 rounded-xl px-4 py-3 focus:outline-none focus:border-tune-500" />
                  {err && <p className="text-xs text-red-600 mt-2">{err}</p>}
                  <button onClick={() => confirmOther('other')} className="w-full mt-3 py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-2xl font-bold shadow-lg">Next</button>
                </>

              {step === 'minutes' && (

                  <h2 className="text-lg font-bold">How long did you listen?</h2>
                  <p className="text-xs text-zen-500 mb-4">{pick.showName}</p>
                  {err && <div className="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-3 border border-red-100">{err}</div>}
                  <div className="grid grid-cols-3 gap-2">
                    {[5, 10, 15, 20, 25, 30].map((m) => (
                      <button key={m} onClick={() => save(m)} disabled={busy}
                        className={'rounded-2xl py-5 text-lg font-bold border transition-opacity '
                          + (savingMin === m
                              ? 'bg-tune-50 border-tune-500 text-tune-700'
                              : 'bg-white border-zen-200 hover:border-tune-500 hover:bg-tune-50 ' + (busy ? 'opacity-40' : ''))}>
                        {savingMin === m ? (
                          <>
                            <span className="mx-auto block w-6 h-6 border-2 border-tune-200 border-t-tune-600 rounded-full animate-spin"></span>
                            <span className="block text-[11px] font-normal text-tune-600 mt-1">saving</span>
                          </>
                        ) : (
                          <>
                            {m === 30 ? '30+' : m}
                            <span className="block text-[11px] font-normal text-zen-500">min</span>
                          </>
                        )}
                      </button>
                    ))}
                  </div>
                  {busy && (
                    <p className="flex items-center justify-center gap-2 text-sm text-tune-600 font-bold mt-4">
                      <span className="w-4 h-4 border-2 border-tune-200 border-t-tune-600 rounded-full animate-spin"></span>
                      Saving your listening...
                    </p>
                  )}
                  <div className={'text-center mt-4 text-sm text-zen-500 ' + (busy ? 'opacity-40' : '')}>
                    When was this?{' '}
                    <select value={date} onChange={(e) => setDate(e.target.value)} disabled={busy}
                      className="border border-zen-200 rounded-lg px-2 py-1 bg-white text-zen-800">
                      {dateOptions.map((o) => <option key={o.ymd} value={o.ymd}>{o.label}</option>)}
                    </select>

              {step === 'done' && (
                <>

                    <h2 className="text-xl font-bold">Logged.</h2>
                    <p className="text-sm text-zen-500 mt-1">{lastSaved && (lastSaved.showName + ' · ' + lastSaved.minutes + ' min')}</p>
                    {sum.thisWeekMinutes >= cfg.minMinutes &&
                      <p className="text-sm text-tune-600 font-bold mt-3">That is your {cfg.minMinutes} minutes for this week.</p>}
                  </div>
                  <button onClick={() => go('home')} className="w-full py-4 bg-tune-600 hover:bg-tune-500 text-white rounded-2xl font-bold shadow-lg">Back to my calendar</button>
                  <button onClick={undo} disabled={busy} className="w-full mt-3 text-sm text-zen-400 hover:text-tune-600 disabled:opacity-50">
                    {busy ? 'Undoing...' : 'Made a mistake? Undo'}
                  </button>
                </>
              )}

          </Shell>

      // ===== 教師の画面 =====
      const TeacherApp = ({ passcode, onLogout }) => {
        const [d, setD] = useState(null);
        const [err, setErr] = useState('');

        useEffect(() => {
          gs('teacherGetData', passcode).then(setD).catch((e) => setErr(friendlyError(e)));
        }, []);

        if (err) return <Shell who="Teacher" onLogout={onLogout} wide><p className="text-center text-red-600 py-12">{err}</p></Shell>;
        if (!d) return <Shell who="Teacher" onLogout={onLogout} wide><Spinner emoji="🐯" title="Loading..." subtitle="" /></Shell>;

        const cfg = d.config, cw = cfg.currentWeek;
        // 「経過した週」= 月曜日がもう来ている必須の週の数（ボーナス週は数えない）
        const started = (w) => diffDays(w.monday, cfg.today) >= 0;
        const elapsed = cfg.weekList.filter((w) => !w.bonus && !w.sandbox && started(w)).length;
        let doneNow = 0, hit = 0, possible = 0, totalMin = 0, bonusStudents = 0, triedStudents = 0;

        const rows = d.students.map((s) => {
          let achieved = 0, bonus = 0, tried = 0;
          const cells = cfg.weekList.map((w) => {
            const min = s.weeks[String(w.n)] ? s.weeks[String(w.n)].minutes : 0;
            if (w.sandbox) { tried += min; return { w, min, special: true, started: started(w) }; }
            if (w.bonus) { bonus += min; return { w, min, special: true, started: started(w) }; }
            const ok = min >= cfg.minMinutes;
            if (ok) achieved++;
            if (String(w.n) === String(cw) && ok) doneNow++;
            if (started(w)) { possible++; if (ok) hit++; }
            return { w, min, ok, started: started(w) };
          });
          if (bonus) bonusStudents++;
          if (tried) triedStudents++;
          totalMin += s.totalMinutes;
          return { s, cells, achieved, bonus, tried, behind: elapsed > 1 && achieved < elapsed - 1 };
        });
        const hasSandbox = cfg.weekList.some((w) => w.sandbox);

        return (
          <Shell who="Teacher" onLogout={onLogout} wide>
            <>
              <div className="text-center py-2 mb-6">
                <h2 className="text-3xl font-light text-zen-900 mb-2">Class Overview</h2>
                <p className="text-zen-500 text-sm">
                  {cw ? (isNaN(Number(cw)) ? (cfg.weekList.find((w) => String(w.n) === String(cw)) || {}).label : 'Week ' + cw) : 'Outside the listening weeks'}
                  {' · '}{cfg.weeks} required weeks · minimum {cfg.minMinutes} minutes per week
                </p>
              </div>

              <div className="flex gap-2 mb-5 flex-wrap">
                <Stat value={d.students.length} label="students" />
                <Stat value={doneNow} label="done this week" />
                <Stat value={possible ? Math.round(hit / possible * 100) + '%' : '—'} label="weekly completion" />
                {hasSandbox
                  ? <Stat value={triedStudents} label="tried it out" />
                  : <Stat value={bonusStudents} label="did Pump-Up Week" />}
              </div>

              <div className="bg-white border border-zen-200 rounded-2xl p-4 mb-5 overflow-x-auto">
                <table className="w-full text-xs border-collapse">
                  <thead>
                    <tr>
                      <th className="text-left sticky left-0 bg-white min-w-[150px] text-zen-500 font-medium">Name</th>
                      {cfg.weekList.map((w) => (
                        <th key={String(w.n)} title={w.label ? w.label + (w.sandbox ? ' (practice only)' : ' (optional)') : ''}
                          className={'px-1 font-medium ' + (w.sandbox
                            ? 'text-zen-400'
                            : w.bonus
                              ? 'text-amber-600'
                              : (String(w.n) === String(cw) ? 'text-tune-600 font-bold' : 'text-zen-400'))}>
                          {(w.bonus || w.sandbox) ? String(w.n) : 'W' + w.n}
                        </th>
                      ))}
                      <th className="text-zen-500 font-medium px-1">Weeks</th>
                      <th className="text-zen-500 font-medium px-1">Min</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((r) => (
                      <tr key={r.s.name}>
                        <td className={'text-left sticky left-0 bg-white py-1 text-[13px] ' + (r.behind ? 'text-orange-600' : 'text-zen-800')}>{r.s.name}</td>
                        {r.cells.map((c) => (
                          <td key={String(c.w.n)} className="text-center py-1">
                            <span title={c.min ? c.min + ' min' : (c.special ? 'nothing logged' : 'no entry')}
                              className="inline-block w-6 h-6 leading-6 rounded-md text-[10px]"
                              style={{
                                background: c.min
                                  ? palette(c.w)[levelOf(c.min)]
                                  : (c.special ? (c.w.sandbox ? '#f4f4f1' : '#fdf8ee') : (c.started ? '#f6efea' : '#f7f7f5')),
                                color: levelOf(c.min) >= 2 ? '#fff' : (c.w.sandbox ? '#6b6b58' : c.w.bonus ? '#8a5a12' : '#565d93')
                              }}>{c.min || ''}</span>
                          </td>
                        ))}
                        <td className="text-center font-bold text-tune-600">{r.achieved}/{elapsed}</td>
                        <td className="text-center text-zen-500">{r.s.totalMinutes}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <p className="text-[11px] text-zen-400 mt-3">Numbers are total minutes for that week. Pale cells mean no entry. An orange name means two or more weeks with nothing. <span className="text-zen-500">TRY = Try-Out Week (practice, counted nowhere).</span> <span className="text-amber-600">PU = Pump-Up Week (optional, not counted toward the completion rate or the streak).</span></p>
              </div>

              <div className="bg-white border border-zen-200 rounded-2xl p-4 mb-5">
                <h2 className="font-bold mb-2">Most popular shows</h2>
                <ol className="list-decimal pl-5 text-sm space-y-0.5">
                  {d.popular.length
                    ? d.popular.slice(0, 12).map((x) => <li key={x.name}>{x.name} <span className="text-zen-400">({x.n})</span></li>)
                    : <li className="text-zen-400 list-none">No entries yet</li>}
                </ol>
              </div>

              <a href={cfg.sheetUrl} target="_blank" rel="noopener" className="text-sm text-tune-600 underline">Open the spreadsheet (raw data)</a>
            </>
          </Shell>
        );
      };

      // ===== ルート =====
      const App = () => {
        const [boot, setBoot] = useState(null);
        const [auth, setAuth] = useState(null);          // {name, pin}
        const [teacher, setTeacher] = useState(null);    // passcode
        const [state, setState] = useState(null);        // {entries, lastShow}
        const [error, setError] = useState('');
        const [busy, setBusy] = useState(false);
        const [ready, setReady] = useState(false);

        useEffect(() => {
          (async () => {
            try {
              const b = await gs('getBootstrap');
              setBoot(b);
              const saved = loadAuth();
              if (saved) {
                try {
                  await gs('studentLogin', saved.name, saved.pin);
                  const st = await gs('getMyLog', saved);
                  setAuth(saved); setState(st); saveAuth(saved);
                } catch (e) { saveAuth(null); }
              } else {
                const tp = loadTeacher();
                if (tp) {
                  try { await gs('teacherLogin', tp); setTeacher(tp); } catch (e) {}
                }
              }
            } catch (e) { setError(friendlyError(e)); }
            setReady(true);
          })();
        }, []);

        const handleStudentLogin = async (name, pin) => {
          setBusy(true); setError('');
          try {
            await gs('studentLogin', name, pin);
            const a = { name, pin };
            const st = await gs('getMyLog', a);
            saveAuth(a); setAuth(a); setState(st);
          } catch (e) { setError(friendlyError(e)); }
          setBusy(false);
        };

        const handleTeacherLogin = async (passcode) => {
          setBusy(true); setError('');
          try {
            await gs('teacherLogin', passcode);
            try { localStorage.setItem('TIG_TEACHER', passcode); } catch (e) {}
            setTeacher(passcode);
          } catch (e) { setError(friendlyError(e)); }
          setBusy(false);
        };

        const logout = () => {
          saveAuth(null);
          try { localStorage.removeItem('TIG_TEACHER'); } catch (e) {}
          setAuth(null); setTeacher(null); setState(null);
        };

        if (!ready) return <Spinner emoji="🐯" title="Loading Tune-In Gym..." subtitle="" />;
        if (error && !boot) return <div className="min-h-screen flex items-center justify-center p-8 text-center text-red-600">{error}</div>;
        if (teacher) return <TeacherApp passcode={teacher} onLogout={logout} />;
        if (auth && state) return <StudentApp auth={auth} boot={boot} state={state} setState={setState} onLogout={logout} />;

        return <LoginScreen students={boot.students} onStudentLogin={handleStudentLogin}
                 onTeacherLogin={handleTeacherLogin} error={error} busy={busy} />;
      };

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
